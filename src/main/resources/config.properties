# ===== 百度地图鉴权参数（必填，会过期）=====
# 获取方式：浏览器打开 map.baidu.com 搜索任意地址 → F12 → Network → 筛选 map.baidu.com
#   → 找到 qt=s 请求：复制 URL 中 auth / seckey 参数，以及请求头 Cookie
# 过期后程序会尝试通过 Edge CDP 自动刷新并回写到工作目录的 config.properties（见 README）
baidu.auth=【你的auth，从浏览器抓包复制】
baidu.seckey=【你的seckey，从浏览器抓包复制】
baidu.validate=34993
# 浏览器 Cookie（反爬必需，缺失会触发 need_recaptcha；至少包含 BAIDUID/BDUSS）
baidu.cookie=【你的Cookie，从 qt=s 请求头复制】

# 城市代码：深圳 340
baidu.cityCode=340
# 搜索视野（墨卡托）。注意：勿使用 HAR 抓包里的小视野，会把结果限制在框内导致大量地址查不到
baidu.viewBound=(12650000,2550000;12750000,2600000)
# 结果坐标合理范围（lonMin,latMin,lonMax,latMax），候选超出则跳过（防跨市/异地错配）
baidu.bounds=113.75,22.40,114.65,22.88

# ===== 鉴权自动刷新（通过 Edge 浏览器 CDP 抓取新 key） =====
# 失效时是否自动刷新
baidu.autoRefresh=true
# Edge 远程调试端口（Edge 需以 --remote-debugging-port=9222 启动才会开放）
edge.debugPort=9222
# 端口不可用时是否自动拉起独立 Edge 实例（使用独立 profile，不影响日常使用的 Edge）
edge.autoLaunch=true
# 单次抓取超时秒数
edge.captureSeconds=25
# 一次运行中最多自动刷新次数
auth.maxRefreshes=10
# 连续多少个地址 content 为空时判定为鉴权失效（避免把"查无结果"误判为失效）
auth.emptyThreshold=3

# ===== 输入输出 =====
input.path=dizhi.txt
output.path=output.txt
html.path=map.html
cache.dir=cache
# 百度地图 JS API 的浏览器端 AK（map.html 中使用），在 https://lbsyun.baidu.com 申请
html.ak=【你的AK】
# region_id 起始值
region.id.start=10124

# ===== 请求控制 =====
# 请求间隔毫秒
request.delay.ms=300
# 连接超时毫秒
http.connectTimeoutMs=10000
# 读取超时毫秒
http.readTimeoutMs=20000
# 失败重试次数
http.retries=2

# ===== 匹配与流程 =====
# 择优最低置信分，低于该值标记"低置信度"
match.score.threshold=40
# 离线重放模式：true 时不联网，只读 cache 目录重放生成 output.txt / map.html
offline=false
# 坐标转换算法：official=百度官方 MC2LL（推荐，默认）；simple=简化公式（偏差约15公里，仅对照用）
coord.algorithm=official
