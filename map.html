var map = new BMap.Map('container');
map.enableScrollWheelZoom(true);
var markers = [], polygons = [];
function statusColor(st){ return st === '成功' ? '#00b96b' : '#ff9800'; }
function buildAll(){
  var pts = [];
  REGIONS.forEach(function(r, i){
    var color = statusColor(r.status);
    var pt = new BMap.Point(r.center.lon, r.center.lat);
    pts.push(pt);
    var icon = new BMap.Symbol(BMap_Symbol_SHAPE_CIRCLE, {scale: 6, fillColor: color, fillOpacity: 0.95, strokeColor: '#333', strokeWeight: 0.5});
    var mk = new BMap.Marker(pt, {icon: icon});
    var label = new BMap.Label(r.regionName, {offset: new BMap.Size(8, -8)});
    label.setStyle({fontSize: '11px', borderColor: color, color: '#333', padding: '1px 4px'});
    mk.setLabel(label);
    mk.addEventListener('click', function(){ openInfo(i, pt); });
    markers.push(mk);
    if (r.polygon && r.polygon.length >= 3){
      var bpts = [];
      r.polygon.forEach(function(p){ bpts.push(new BMap.Point(p.lon, p.lat)); });
      var pg = new BMap.Polygon(bpts, {strokeColor: color, strokeWeight: 1.5, strokeOpacity: 0.9, fillColor: color, fillOpacity: 0.25});
      pg.addEventListener('click', function(){ openInfo(i, pt); });
      polygons.push(pg);
    }
  });
  map.setViewport(pts);
}
function openInfo(i, pt){
  var r = REGIONS[i];
  var html = '<div style="font-size:13px;line-height:1.8;max-width:320px">'
    + '<b>' + esc(r.regionName) + '</b> (ID:' + r.regionId + ')<br/>'
    + '状态：<span style="color:' + statusColor(r.status) + '">' + esc(r.status) + '</span><br/>'
    + '输入地址：' + esc(r.inputAddress) + '<br/>'
    + '选中候选：' + esc(r.selectedName || '-') + '<br/>'
    + '类型：' + esc(r.placeType) + '<br/>'
    + '子查询：' + esc(r.subQueries || '-') + '<br/>'
    + '评分：' + esc(r.scoreDetail || '-') + '<br/>'
    + '中心：' + r.center.lon.toFixed(6) + ', ' + r.center.lat.toFixed(6) + '<br/>'
    + '边界顶点数：' + (r.polygon ? r.polygon.length : 0)
    + '</div>';
  map.openInfoWindow(new BMap.InfoWindow(html), pt);
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function filter(st){
  REGIONS.forEach(function(r, i){
    var show = st === 'all' || r.status === st;
    markers[i].setVisible(show);
    if (polygons[i]) polygons[i].setVisible(show);
  });
}
var btns = document.querySelectorAll('#panel button');
btns.forEach(function(b){
  b.addEventListener('click', function(){
    btns.forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    filter(b.getAttribute('data-st'));
  });
});
if (REGIONS.length === 0){
  map.centerAndZoom(new BMap.Point(114.05, 22.55), 12);
} else {
  buildAll();
  REGIONS.forEach(function(r, i){ map.addOverlay(markers[i]); if (polygons[i]) map.addOverlay(polygons[i]); });
}
</script>
